baseURL = "https://twoeggdu.github.io/AllWeather/"
languageCode = "zh-cn"
title = "蜗牛全天候"
defaultContentLanguage = "zh-cn"
hasCJKLanguage = true
enableRobotsTXT = true
summaryLength = 120
disableKinds = ["taxonomy", "term", "RSS"]

[pagination]
pagerSize = 12

[permalinks]
posts = "/posts/:slug/"
glossary = "/glossary/:slug/"

[outputs]
home = ["HTML"]
section = ["HTML"]
page = ["HTML"]

[markup]
