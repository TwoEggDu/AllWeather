baseURL = "https://twoeggdu.github.io/AllWeather/"
locale = "zh-cn"
title = "蜗牛量化"
defaultContentLanguage = "zh-cn"
hasCJKLanguage = true
enableRobotsTXT = true
summaryLength = 120

[pagination]
pagerSize = 12

[permalinks]
posts = "/posts/:slug/"
glossary = "/glossary/:slug/"

[taxonomies]
tag = "tags"

[outputs]
home = ["HTML", "RSS"]
section = ["HTML", "RSS"]
page = ["HTML"]

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = false
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 3
    ordered = false

[sitemap]
changefreq = "weekly"
priority = 0.6

[services]
  [services.rss]
    limit = 25

[params]
description = "蜗牛量化建设的开放中国市场投研知识库，跟踪宏观政策、国家资本、产业基本面、市场资金与全球反馈。"
tagline = "跟踪政策，验证利润，理解资金，持续复盘。"
subtitle = "中国政策 / 国家资本 / 产业基本面 / 市场资金"
repoNote = "顶层设计、研究模板、路线图与系统文档保留在仓库的中文目录中。"
disclaimer = "本文仅用于学习与研究，不构成任何投资建议。"
author = "NHT"
mainSections = ["posts"]
