baseURL = "https://twoeggdu.github.io/AllWeather/"
languageCode = "zh-cn"
title = "蜗牛全天候"
defaultContentLanguage = "zh-cn"
hasCJKLanguage = true
enableRobotsTXT = true
summaryLength = 120
disableKinds = ["taxonomy", "term", "RSS"]

[pagination]
pagerSize = 12

[permalinks]
posts = "/posts/:slug/"
glossary = "/glossary/:slug/"

[outputs]
home = ["HTML"]
section = ["HTML"]
page = ["HTML"]

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = false
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 3
    ordered = false

[sitemap]
changefreq = "weekly"
priority = 0.6

[services]
  [services.rss]
    limit = 25

[params]
description = "蜗牛全天候是一套基于宏观环境、资产分层、市场信号、执行纪律与决策复盘的个人投资研究和模拟框架。"
tagline = "先建立纪律，再讨论收益。"
subtitle = "个人投资研究与模拟框架"
repoNote = "当前处于公开设计阶段：展示框架、边界与验证路线，不提供实时信号或交易指令。"
disclaimer = "本文仅用于学习与研究，不构成任何投资建议。"
author = "NHT"
mainSections = []
