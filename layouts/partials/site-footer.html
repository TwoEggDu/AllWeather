<footer class="site-footer">
  <div class="footer-brand">
    <a class="brand" href="{{ site.Home.Permalink }}">
      <span class="brand-mark" aria-hidden="true"><i></i><b>AW</b></span>
      <span class="brand-copy"><strong>蜗牛量化</strong><span>Open China Research</span></span>
    </a>
    <p>{{ site.Params.tagline }}<br>一个可阅读、可检验、可修正的开放投研知识库。</p>
  </div>
  <div class="footer-nav-group">
    <p class="eyebrow">Explore</p>
    <a href="{{ printf "%s%s" site.BaseURL "macro-index/" }}">投研地图</a>
    <a href="{{ printf "%s%s" site.BaseURL "posts/" }}">全部文章</a>
    <a href="{{ printf "%s%s" site.BaseURL "topics/" }}">研究栏目</a>
    <a href="{{ printf "%s%s" site.BaseURL "glossary/" }}">术语库</a>
  </div>
  <div class="footer-nav-group">
    <p class="eyebrow">Elsewhere</p>
    <a href="{{ printf "%s%s" site.BaseURL "about/" }}">关于本站</a>
    <a href="{{ printf "%s%s" site.BaseURL "disclaimer/" }}">免责声明</a>
    {{ with site.Home.OutputFormats.Get "RSS" }}<a href="{{ .Permalink }}">RSS 订阅</a>{{ end }}
  </div>
  <div class="footer-note">
    <p>{{ site.Params.disclaimer }}</p>
    <p>© {{ now.Year }} {{ site.Params.author }}</p>
  </div>
</footer>
